board: None
name: Default (Test Drive no I/O)
meta: CNC_Alcatorda
stepping:
  engine: RMT
  idle_ms: 250
  pulse_us: 2
  dir_delay_us: 1
  disable_delay_us: 0
  segments: 12
kinematics: {}
axes:
  homing_runs: 2
  x:
    steps_per_mm: 800
    max_rate_mm_per_min: 700
    acceleration_mm_per_sec2: 30
    max_travel_mm: 280
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1
      tmc_2209:
        step_pin: gpio.12
        direction_pin: gpio.14
        disable_pin: gpio.4
        addr: 0
        uart_num: 1
  y:
    steps_per_mm: 800
    max_rate_mm_per_min: 700
    acceleration_mm_per_sec2: 30
    max_travel_mm: 200
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1
      tmc_2209:
        step_pin: gpio.27
        direction_pin: gpio.26
        disable_pin: gpio.5
        addr: 1
        uart_num: 1
  z:
    steps_per_mm: 800
    max_rate_mm_per_min: 700
    acceleration_mm_per_sec2: 30
    max_travel_mm: 100
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1
      tmc_2209:
        step_pin: gpio.25
        direction_pin: gpio.33
        disable_pin: gpio.13
        addr: 2
        uart_num: 1
control:
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN
  macro0_pin: NO_PIN
  macro1_pin: NO_PIN
  macro2_pin: NO_PIN
  macro3_pin: NO_PIN
  fault_pin: NO_PIN
  estop_pin: gpio.32:low
coolant:
  flood_pin: NO_PIN
  mist_pin: NO_PIN
  delay_ms: 0
probe:
  pin: gpio.23:low
  toolsetter_pin: NO_PIN
  check_mode_start: false
  hard_stop: false
macros: {}
start:
  must_home: false
  deactivate_parking: false
  check_limits: true
parking:
  enable: false
  axis: Z
  target_mpos_mm: -5
  rate_mm_per_min: 800
  pullout_distance_mm: 5
  pullout_rate_mm_per_min: 250
user_outputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN
user_inputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN
arc_tolerance_mm: 0.002
junction_deviation_mm: 0.01
verbose_errors: true
report_inches: false
enable_parking_override_control: false
use_line_numbers: false
planner_blocks: 16
uart1:
  txd_pin: gpio.17
  rxd_pin: gpio.16
  rts_pin: NO_PIN
  baud: 115200
  mode: 8N1
  passthrough_baud: 0
  passthrough_mode: '8E1'
PWM:
  output_pin: gpio.22
  enable_pin: NO_PIN
  direction_pin: NO_PIN
  pwm_hz: 1000
  speed_map: 0=0.000% 100=1.000% 10000=100.000%
  off_on_alarm: true
